# Worker de radicación: HTTPS en el puerto 8443 con el certificado existente de evaluador3280.
# Archivo propio: no modifica la configuración de evaluador3280 ni de pocketbase.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name evaluador3280.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/evaluador3280.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evaluador3280.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 5m;
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
